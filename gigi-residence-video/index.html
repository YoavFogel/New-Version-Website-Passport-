</head>
<body>
<canvas id="c"></canvas>
<script src="assets/world.js"></script>
<script src="assets/brands.js"></script>
<script src="anim.js"></script>
<script>
  // Preview mode: open index.html?play to watch in a browser with the voiceover.
  if (location.search.includes('play')) {
    window.addEventListener('load', async () => {
      await window.READY;
      const a = new Audio('assets/voiceover.mp3');
      document.body.addEventListener('click', () => {
        a.currentTime = 0; a.play();
        const t0 = performance.now();
        const loop = () => { const t = (performance.now() - t0) / 1000; window.renderFrame(Math.min(t, 102)); if (t < 102) requestAnimationFrame(loop); };
        loop();
      }, { once: true });
      window.renderFrame(0);
    });
  }
</script>
</body>
</html>
