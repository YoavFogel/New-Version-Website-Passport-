<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ברוכים הבאים לאי.יו פספורט | הבית שלכם לאזרחות ודרכון רומני</title>
  <meta name="description" content="EU Passport, הבית לאזרחות ודרכון רומני. משרד עו&quot;ד אביחי פוגל-רונן.">
  <meta name="theme-color" content="#f4f6fb">
  <link rel="preload" href="assets/img/man.webp" as="image" fetchpriority="high">
  <link rel="preload" href="assets/img/passport.webp" as="image" fetchpriority="high">
  <link rel="preload" href="assets/fonts/heebo-hebrew-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/lenis.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>

  <header class="hero" id="top">
    <div class="hero-bar">
      <img class="logo" src="assets/img/logo.png" width="462" height="159" alt="EU Passport, משרד עו&quot;ד אביחי פוגל-רונן">
    </div>

    <div class="hero-text">
      <h1>ברוכים הבאים <span class="brand">לאי.יו פספורט</span></h1>
      <p class="hero-sub">הבית שלכם לאזרחות ודרכון רומני</p>
    </div>

    <!-- The man and the passport are separate layers. The passport starts over his hand,
         the thumb layer sits above it so he is holding it, and js/main.js lifts it off on scroll. -->
    <figure class="hero-figure" id="hero-figure">
      <img class="hero-man" src="assets/img/man.webp" width="1122" height="1402" alt="גבר בחליפה מחזיק דרכון רומני">
      <img class="passport" id="passport" src="assets/img/passport.webp" width="274" height="329" alt="" aria-hidden="true">
      <img class="hero-thumb" src="assets/img/thumb.webp" width="101" height="99" alt="" aria-hidden="true">
    </figure>
  </header>

  <main id="main">
    <!-- Empty pages, built one by one. data-passport says where the passport rests while
         the section is on screen: side (start | end | center), height in vh, scale. -->
    <section class="page" id="s2" data-passport="end 22 1" aria-label="סקשן 2"><p class="page-label">סקשן 2</p></section>
    <section class="page" id="s3" data-passport="start 30 1" aria-label="סקשן 3"><p class="page-label">סקשן 3</p></section>
    <section class="page" id="s4" data-passport="end 40 0.95" aria-label="סקשן 4"><p class="page-label">סקשן 4</p></section>
    <section class="page" id="s5" data-passport="start 24 1" aria-label="סקשן 5"><p class="page-label">סקשן 5</p></section>
    <section class="page" id="s6" data-passport="center 18 1.1" aria-label="סקשן 6"><p class="page-label">סקשן 6</p></section>
  </main>

  <script src="js/vendor/lenis.min.js" defer></script>
  <script src="js/vendor/gsap.min.js" defer></script>
  <script src="js/vendor/ScrollTrigger.min.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
